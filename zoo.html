<html>
<head>
    <title>My Zoo</title>
<style>

body {
    font-family: Arial, sans-serif;
    background: aliceblue;
    text-align: center;
    padding: 30px;
}

h1 { 
    color: #ff5a43;
}

#zoo { 
    border: 2px solid #ff5a43;
    width: 300px;
    margin: 16px auto;
    padding: 12px;
    border-radius: 10px;
    background: white;
}
.zone {
    border: 1px solid #ff5a43;
    margin: 6px 0;
    padding: 8px 12px;
    border-radius: 6px;
    text-align: left;
}
    button {
        background: #ff5a43;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
    }
    </style>
</head>
<body> 
    <h1>Welcome to My Zoo!</h1>
    <p> Use JavaScript and the dom to add animals to each cage!</p>

    <div id="zoo">
        <div class="zone">Zone 1: <span id="zone1"></span></div>
        <div class="zone">Zone 2: <span id="zone2"></span></div>
        <div class="zone">Zone 3: <span id="zone3"></span></div> 
        <div class="zone"> Total Animals: <span id="total"></span></div>
    </div>

    <br>
    <button onclick="openZoo()">Open The Zoo!</button>
    
    <p id="zoo-status"></p>

    <script>
function openZoo() {
    /* task 1: Add your first animal to Zone 1 */
    document.getElementById("zone1").innerText = "Lion";
    /* task 2: Add your second animal to Zone 2 */
    document.getElementById("zone2").innerText = "Elephant";
    /* task 3: Add your third animal to Zone 3 */
    document.getElementById("zone3").innerText = "penguin";
    /* task 4: show the total number of animals */
    document.getElementById("total").innerText = "3";
    /* task 5: change the zoo background colour */
    document.getElementById("zoo") .style.background = "lightgreen";
    /* task 6: Use the document object to show the page title */
    document.getElementById("zoo-status").innerHTML = document.title + " is now open!";
}
    </script>
</body>
</html>
